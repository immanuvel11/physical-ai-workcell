# Loaded by gz_ros2_control inside Gazebo (see pai_description/urdf/panda_gz.urdf.xacro)
controller_manager:
  ros__parameters:
    update_rate: 250  # Hz
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    panda_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    panda_hand_controller:
      type: position_controllers/GripperActionController

panda_arm_controller:
  ros__parameters:
    joints: [panda_joint1, panda_joint2, panda_joint3, panda_joint4, panda_joint5, panda_joint6, panda_joint7]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 1.0
      # No per-joint goal tolerances: under load the simulated arm converges a little late and
      # strict tolerances abort good motions. The skill server waits for the TCP to settle instead.

panda_hand_controller:
  ros__parameters:
    joint: panda_finger_joint1
    goal_tolerance: 0.002
    allow_stalling: true      # fingers stall on an object when grasping -> report success
    stall_timeout: 0.5
    stall_velocity_threshold: 0.001
